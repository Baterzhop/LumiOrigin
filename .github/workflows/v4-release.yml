name: Lumi V4 Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v4.*"

permissions:
  contents: read

jobs:
  ga-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate GA helper scripts
        run: |
          python -m py_compile scripts/lumi_version.py scripts/validate_ga_evidence.py scripts/ga_acceptance_macos.py
          bash -n scripts/notarize_macos_app.sh scripts/build_macos_app.sh
      - name: Require tag to match canonical project version
        if: github.ref_type == 'tag'
        run: python scripts/lumi_version.py --verify-tag "$GITHUB_REF_NAME"
      - name: Fail closed for final 4.0.0 without verified external evidence
        if: github.ref == 'refs/tags/v4.0.0'
        run: python scripts/validate_ga_evidence.py release-evidence/4.0.0-ga.json
      - name: Upload final GA evidence
        if: github.ref == 'refs/tags/v4.0.0'
        uses: actions/upload-artifact@v4
        with:
          name: lumi-ga-evidence
          path: release-evidence/4.0.0-ga.json
          if-no-files-found: error

  core-wheel:
    needs: ga-evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require tag to match canonical project version
        if: github.ref_type == 'tag'
        run: python scripts/lumi_version.py --verify-tag "$GITHUB_REF_NAME"
      - name: Build wheel and source archive
        run: |
          python -m pip install -c services/core/requirements.lock build
          python -m build services/core
      - name: Verify wheel in clean environment
        run: |
          python -m venv "${RUNNER_TEMP}/verify-wheel"
          "${RUNNER_TEMP}/verify-wheel/bin/python" -m pip install -c services/core/requirements.lock services/core/dist/lumi_core-*.whl
          "${RUNNER_TEMP}/verify-wheel/bin/python" -m pip check
          "${RUNNER_TEMP}/verify-wheel/bin/python" scripts/lumi_version.py --verify-runtime
          "${RUNNER_TEMP}/verify-wheel/bin/lumi-core" version
          "${RUNNER_TEMP}/verify-wheel/bin/lumi-core" acceptance --help >/dev/null
      - name: Generate Core checksums
        run: |
          cd services/core/dist
          sha256sum lumi_core-* > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
      - name: Upload Core distribution
        uses: actions/upload-artifact@v4
        with:
          name: lumi-core-python
          path: services/core/dist/*
          if-no-files-found: error

  macos-app:
    needs: ga-evidence
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Validate notarization entrypoint
        run: bash -n scripts/notarize_macos_app.sh scripts/build_macos_app.sh
      - name: Resolve and validate release version
        id: version
        run: |
          VERSION="$(python3 scripts/lumi_version.py)"
          ZIP="$(python3 scripts/lumi_version.py --artifact-name)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            python3 scripts/lumi_version.py --verify-tag "$GITHUB_REF_NAME"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
      - name: Build and ad-hoc sign app bundle
        run: bash scripts/build_macos_app.sh
      - name: Verify package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="${{ steps.version.outputs.zip }}"
          plutil -lint dist/Lumi.app/Contents/Info.plist
          codesign --verify --deep --strict dist/Lumi.app
          test -f "dist/$ZIP"
          BUNDLE_VERSION="$(plutil -extract CFBundleShortVersionString raw -o - dist/Lumi.app/Contents/Info.plist)"
          test "$BUNDLE_VERSION" = "$VERSION"
      - name: Generate macOS checksum
        run: |
          cd dist
          ZIP="${{ steps.version.outputs.zip }}"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          shasum -a 256 -c "$ZIP.sha256"
          cat "$ZIP.sha256"
      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: lumi-macos
          path: |
            dist/${{ steps.version.outputs.zip }}
            dist/${{ steps.version.outputs.zip }}.sha256
          if-no-files-found: error
