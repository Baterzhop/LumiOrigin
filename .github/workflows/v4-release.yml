name: Lumi V4 Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v4.*"

permissions:
  contents: read

jobs:
  ga-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate GA helper scripts
        run: |
          python -m py_compile scripts/validate_ga_evidence.py scripts/assemble_ga_evidence.py scripts/ga_acceptance_macos.py
          bash -n scripts/notarize_macos_app.sh scripts/configure_branch_protection.sh
      - name: Require tag to match Lumi Core package version
        if: github.ref_type == 'tag'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CORE_VERSION="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path('services/core/src/lumi_core/__init__.py').read_text(encoding='utf-8')
          match = re.search(r'__version__\s*=\s*["\x27]([^"\x27]+)', text)
          if not match:
              raise SystemExit('Core version not found')
          print(match.group(1))
          PY
          )"
          test "$TAG_VERSION" = "$CORE_VERSION" || {
            echo "Tag version $TAG_VERSION does not match Core version $CORE_VERSION" >&2
            exit 1
          }
      - name: Fail closed for final 4.0.0 without verified external evidence
        if: github.ref == 'refs/tags/v4.0.0'
        run: python scripts/validate_ga_evidence.py release-evidence/4.0.0-ga.json
      - name: Bind final tag to the exact physically accepted candidate tree
        if: github.ref == 'refs/tags/v4.0.0'
        run: |
          CANDIDATE="$(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('release-evidence/4.0.0-ga.json').read_text(encoding='utf-8'))
          print(payload['candidate_commit'])
          PY
          )"
          git cat-file -e "$CANDIDATE^{commit}"
          git merge-base --is-ancestor "$CANDIDATE" HEAD || {
            echo "Physically accepted candidate is not an ancestor of the final tag" >&2
            exit 1
          }
          CANDIDATE_VERSION="$(git show "$CANDIDATE:services/core/src/lumi_core/__init__.py" | python -c 'import re,sys; text=sys.stdin.read(); m=re.search(r"__version__\\s*=\\s*[\"\\x27]([^\"\\x27]+)", text); print(m.group(1) if m else "")')"
          test "$CANDIDATE_VERSION" = "4.0.0" || {
            echo "Physical acceptance candidate must itself identify as 4.0.0; got $CANDIDATE_VERSION" >&2
            exit 1
          }
          mapfile -t CHANGED < <(git diff --name-only "$CANDIDATE"..HEAD)
          if [[ "${#CHANGED[@]}" -ne 1 || "${CHANGED[0]}" != "release-evidence/4.0.0-ga.json" ]]; then
            echo "Final tag differs from the physical acceptance candidate outside the evidence file:" >&2
            printf '  %s\n' "${CHANGED[@]}" >&2
            exit 1
          fi
      - name: Upload final GA evidence
        if: github.ref == 'refs/tags/v4.0.0'
        uses: actions/upload-artifact@v4
        with:
          name: lumi-ga-evidence
          path: release-evidence/4.0.0-ga.json
          if-no-files-found: error

  core-wheel:
    needs: ga-evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and source archive
        run: |
          python -m pip install -c services/core/requirements.lock build
          python -m build services/core
      - name: Verify wheel in clean environment
        run: |
          python -m venv "${RUNNER_TEMP}/verify-wheel"
          "${RUNNER_TEMP}/verify-wheel/bin/python" -m pip install -c services/core/requirements.lock services/core/dist/lumi_core-*.whl
          "${RUNNER_TEMP}/verify-wheel/bin/python" -m pip check
          "${RUNNER_TEMP}/verify-wheel/bin/lumi-core" version
          "${RUNNER_TEMP}/verify-wheel/bin/lumi-core" acceptance --help >/dev/null
      - name: Generate Core checksums
        run: |
          cd services/core/dist
          sha256sum lumi_core-* > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
      - name: Upload Core distribution
        uses: actions/upload-artifact@v4
        with:
          name: lumi-core-python
          path: services/core/dist/*
          if-no-files-found: error

  macos-app:
    needs: ga-evidence
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Validate notarization entrypoint
        run: bash -n scripts/notarize_macos_app.sh
      - name: Resolve release version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path('services/core/src/lumi_core/__init__.py').read_text(encoding='utf-8')
          match = re.search(r'__version__\s*=\s*["\x27]([^"\x27]+)', text)
          if not match:
              raise SystemExit('Core version not found')
          print(match.group(1))
          PY
          )"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build and ad-hoc sign app bundle
        env:
          LUMI_VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/build_macos_app.sh
      - name: Verify package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          plutil -lint dist/Lumi.app/Contents/Info.plist
          codesign --verify --deep --strict dist/Lumi.app
          test -f "dist/Lumi-macOS-$VERSION.zip"
          BUNDLE_VERSION="$(plutil -extract CFBundleShortVersionString raw -o - dist/Lumi.app/Contents/Info.plist)"
          test "$BUNDLE_VERSION" = "$VERSION"
      - name: Generate macOS checksum
        run: |
          cd dist
          ZIP="Lumi-macOS-${{ steps.version.outputs.version }}.zip"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          shasum -a 256 -c "$ZIP.sha256"
          cat "$ZIP.sha256"
      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: lumi-macos
          path: |
            dist/Lumi-macOS-${{ steps.version.outputs.version }}.zip
            dist/Lumi-macOS-${{ steps.version.outputs.version }}.zip.sha256
          if-no-files-found: error
