name: Lumi V4 CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lumi-v4-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate shell entrypoints
        run: bash -n scripts/install_lumi.sh scripts/start_lumi.sh scripts/build_macos_app.sh scripts/notarize_macos_app.sh scripts/ga_target_mac.sh scripts/configure_branch_protection.sh
      - name: Install tested dependency set
        run: |
          python -m pip install -c services/core/requirements.lock -e "services/core[dev]"
          python -m pip check
          lumi-core version
      - name: CLI doctor
        env:
          LUMI_DATA_DIR: ${{ runner.temp }}/lumi-doctor
          LUMI_RAG_DENSE: "false"
        run: lumi-core doctor --initialize --no-model --require-database
      - name: Unit and API integration tests
        run: pytest services/core/tests -q
      - name: Deterministic multilingual RAG regression gate
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/eval_rag.py --assert-thresholds
      - name: Deterministic multilingual memory regression gate
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/eval_memory.py --assert-thresholds
      - name: Fallback HTTP/SSE acceptance test
        if: matrix.os == 'ubuntu-latest'
        env:
          LUMI_DATA_DIR: ${{ runner.temp }}/lumi-e2e-fallback
          LUMI_RAG_DENSE: "false"
          LUMI_MODEL_TIMEOUT: "1"
        run: |
          lumi-core serve --host 127.0.0.1 --port 8791 > "${RUNNER_TEMP}/lumi-core-fallback.log" 2>&1 &
          CORE_PID=$!
          cleanup() {
            kill "$CORE_PID" >/dev/null 2>&1 || true
            wait "$CORE_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          python - <<'PY'
          import time
          import httpx
          deadline = time.time() + 20
          while time.time() < deadline:
              try:
                  response = httpx.get("http://127.0.0.1:8791/ready", timeout=1)
                  if response.status_code == 200 and response.json().get("ok") is True:
                      raise SystemExit(0)
              except Exception:
                  pass
              time.sleep(0.25)
          raise SystemExit("Core did not become ready")
          PY
          lumi-core acceptance --base-url http://127.0.0.1:8791
      - name: Primary-model + dense-embedding acceptance test
        if: matrix.os == 'ubuntu-latest'
        env:
          LUMI_DATA_DIR: ${{ runner.temp }}/lumi-e2e-primary
          LUMI_OLLAMA_URL: http://127.0.0.1:11435/api/chat
          LUMI_OLLAMA_EMBED_URL: http://127.0.0.1:11435/api/embed
          LUMI_OLLAMA_MODEL: lumi-ci-model
          LUMI_EMBEDDING_MODEL: lumi-ci-embed
          LUMI_RAG_DENSE: "true"
          LUMI_MODEL_TIMEOUT: "5"
        run: |
          python scripts/mock_ollama.py --port 11435 > "${RUNNER_TEMP}/mock-ollama.log" 2>&1 &
          MOCK_PID=$!
          lumi-core serve --host 127.0.0.1 --port 8792 > "${RUNNER_TEMP}/lumi-core-primary.log" 2>&1 &
          CORE_PID=$!
          cleanup() {
            kill "$CORE_PID" "$MOCK_PID" >/dev/null 2>&1 || true
            wait "$CORE_PID" >/dev/null 2>&1 || true
            wait "$MOCK_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          python - <<'PY'
          import time
          import httpx
          deadline = time.time() + 20
          while time.time() < deadline:
              try:
                  tags = httpx.get("http://127.0.0.1:11435/api/tags", timeout=1)
                  ready = httpx.get("http://127.0.0.1:8792/ready", timeout=1)
                  if tags.status_code == 200 and ready.status_code == 200 and ready.json().get("ok") is True:
                      raise SystemExit(0)
              except Exception:
                  pass
              time.sleep(0.25)
          raise SystemExit("Primary acceptance services did not become ready")
          PY
          lumi-core doctor --require-model --require-database
          lumi-core acceptance --base-url http://127.0.0.1:8792 --require-model
          python scripts/ga_machine_check.py \
            --base-url http://127.0.0.1:8792 \
            --require-model \
            --approve-tool-write \
            --output "${RUNNER_TEMP}/lumi-ga-machine-evidence.json"
      - name: Build Python distribution
        if: matrix.os == 'ubuntu-latest'
        run: python -m build services/core
      - name: Verify Python artifact checksums
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd services/core/dist
          sha256sum lumi_core-* > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Wheel install smoke in clean environment
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m venv "${RUNNER_TEMP}/lumi-wheel-smoke"
          "${RUNNER_TEMP}/lumi-wheel-smoke/bin/python" -m pip install -c services/core/requirements.lock services/core/dist/lumi_core-*.whl
          "${RUNNER_TEMP}/lumi-wheel-smoke/bin/python" -m pip check
          "${RUNNER_TEMP}/lumi-wheel-smoke/bin/lumi-core" version
          LUMI_DATA_DIR="${RUNNER_TEMP}/lumi-wheel-data" LUMI_RAG_DENSE=false "${RUNNER_TEMP}/lumi-wheel-smoke/bin/lumi-core" doctor --initialize --no-model --require-database
          "${RUNNER_TEMP}/lumi-wheel-smoke/bin/lumi-core" acceptance --help >/dev/null
      - name: API factory import smoke
        env:
          LUMI_DATA_DIR: ${{ runner.temp }}/lumi-api-factory-smoke
          LUMI_RAG_DENSE: "false"
        run: |
          python - <<'PY'
          import lumi_core.api.main as api_main
          assert not hasattr(api_main, "app"), "API module import must not construct the application"
          app = api_main.create_app()
          print(app.title, app.version)
          PY

  macos-client:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build native client
        working-directory: apps/macos
        run: swift build
      - name: Test client transport and configuration models
        working-directory: apps/macos
        run: swift test
      - name: Package local macOS app and verify checksum
        run: |
          bash scripts/build_macos_app.sh
          test -d dist/Lumi.app
          plutil -lint dist/Lumi.app/Contents/Info.plist
          codesign --verify --deep --strict dist/Lumi.app
          test -f dist/Lumi-macOS-4.0.0rc5.zip
          cd dist
          shasum -a 256 Lumi-macOS-4.0.0rc5.zip > Lumi-macOS-4.0.0rc5.zip.sha256
          shasum -a 256 -c Lumi-macOS-4.0.0rc5.zip.sha256

  macos-install-smoke:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run production-style one-command install
        run: PYTHON=python3 bash scripts/install_lumi.sh --no-user-app
      - name: Verify stable runtime layout
        run: |
          CORE="$HOME/Library/Application Support/Lumi/runtime/venv/bin/lumi-core"
          test -x "$CORE"
          LUMI_DATA_DIR="$HOME/Library/Application Support/Lumi/data" LUMI_RAG_DENSE=false "$CORE" doctor --no-model --require-database
          "$CORE" acceptance --help >/dev/null
          test -d dist/Lumi.app
      - name: Acceptance test installed Core runtime
        env:
          LUMI_DATA_DIR: ${{ runner.temp }}/lumi-installed-runtime
          LUMI_RAG_DENSE: "false"
          LUMI_MODEL_TIMEOUT: "1"
        run: |
          VENV="$HOME/Library/Application Support/Lumi/runtime/venv"
          "$VENV/bin/lumi-core" serve --host 127.0.0.1 --port 8793 > "${RUNNER_TEMP}/lumi-installed-core.log" 2>&1 &
          CORE_PID=$!
          cleanup() {
            kill "$CORE_PID" >/dev/null 2>&1 || true
            wait "$CORE_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          "$VENV/bin/python" - <<'PY'
          import time
          import httpx
          deadline = time.time() + 20
          while time.time() < deadline:
              try:
                  response = httpx.get("http://127.0.0.1:8793/ready", timeout=1)
                  if response.status_code == 200 and response.json().get("ok") is True:
                      raise SystemExit(0)
              except Exception:
                  pass
              time.sleep(0.25)
          raise SystemExit("Installed Core did not become ready")
          PY
          "$VENV/bin/lumi-core" acceptance --base-url http://127.0.0.1:8793
          "$VENV/bin/python" scripts/ga_machine_check.py \
            --base-url http://127.0.0.1:8793 \
            --approve-tool-write \
            --output "${RUNNER_TEMP}/lumi-installed-ga-evidence.json"
