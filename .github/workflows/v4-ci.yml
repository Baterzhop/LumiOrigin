name: Lumi V4 CI

on:
  push:
    branches: [main, "lumi-v4-*"]
  pull_request:

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e "services/core[dev]"
      - name: Unit tests
        run: pytest services/core/tests -q
      - name: Import smoke
        run: python -c "from lumi_core.api.main import app; print(app.title, app.version)"

  macos-client:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build native client
        working-directory: apps/macos
        run: swift build
