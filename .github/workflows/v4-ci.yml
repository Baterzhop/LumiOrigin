name: Lumi V4 CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: lumi-v4-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    env:
      LUMI_DATA_DIR: ${{ runner.temp }}/lumi-ci
      LUMI_DATABASE_PATH: ${{ runner.temp }}/lumi-ci/lumi.sqlite3
      LUMI_BACKUP_DIR: ${{ runner.temp }}/lumi-ci/backups
      LUMI_TOOL_WORKSPACE: ${{ runner.temp }}/lumi-ci/workspace
      LUMI_RAG_DENSE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked direct dependencies
        run: python -m pip install -c requirements/constraints-py312.txt -e "services/core[dev]"
      - name: Unit and API integration tests
        run: pytest services/core/tests -q
      - name: Operational CLI smoke
        run: lumi-core doctor --initialize --skip-model --json
      - name: Deterministic RAG regression gate
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/eval_rag.py --assert-thresholds
      - name: Deterministic memory regression gate
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/eval_memory.py --assert-thresholds
      - name: Deterministic local Core acceptance
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/acceptance_local.py
      - name: Import smoke
        run: python -c "from lumi_core.api.main import app; print(app.title, app.version)"

  macos-client:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build native client
        working-directory: apps/macos
        run: swift build
      - name: Test client transport models
        working-directory: apps/macos
        run: swift test
      - name: Build ad-hoc alpha app bundle
        run: bash scripts/build_macos_app.sh dist
      - name: Verify alpha package
        run: |
          test -d dist/Lumi.app
          test -f dist/Lumi-macOS-alpha.zip
          codesign --verify --deep --strict dist/Lumi.app
