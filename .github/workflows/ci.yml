name: CI

on:
  push:
    branches: [main, "lumi-v3-*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Offline evaluation gate
        if: matrix.os == 'ubuntu-latest'
        run: swift run LumiOrigin --eval
      - name: CLI smoke test
        if: matrix.os == 'ubuntu-latest'
        run: swift run LumiOrigin
