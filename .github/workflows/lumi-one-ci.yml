name: Lumi One CI

on:
  push:
    branches:
      - lumi-one/rebuild
  pull_request:

jobs:
  core-tests:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Show Swift version
        run: swift --version
      - name: Run LumiCore tests
        run: swift test

  mac-app-build:
    name: LumiMac build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Build LumiMac
        working-directory: LumiOne/Apps/LumiMac
        run: swift build
