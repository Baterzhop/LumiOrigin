[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumi-core"
version = "4.0.0rc1"
description = "Local-first orchestration core for Lumi V4"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<1",
  "pypdf>=6,<7"
]

[project.scripts]
lumi-core = "lumi_core.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "build>=1,<2"
]
rerank = [
  "sentence-transformers>=3,<6"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lumi_core.storage.migrations" = ["*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
